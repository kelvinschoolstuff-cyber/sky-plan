services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agricast
      POSTGRES_PASSWORD: agricast
      POSTGRES_DB: agricast
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agricast"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://agricast:agricast@db:5432/agricast
      SECRET_KEY: ${SECRET_KEY:-change-me-in-real-use}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_USERNAME: ${AT_USERNAME:-sandbox}
      DEMO_SAMPLE_CALENDAR: ${DEMO_SAMPLE_CALENDAR:-0}
      AUTO_LOAD_CALENDAR: ${AUTO_LOAD_CALENDAR:-1}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  pgdata:
